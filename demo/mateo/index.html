<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM demo</title>
  <meta name="description" content="White-label demo of the client portal: form lead in, AI calls the lead in under a minute, qualifies, books on the calendar, and the whole story lands in the CRM. Fictional companies, sample data.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232c5a5e%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .niche-switch { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; padding: 6px 12px 2px; background: #18211f; }
    .niche-switch .niche { font: 500 12px/1 Geist, system-ui, sans-serif; color: rgba(255,255,255,.72); text-decoration: none; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); transition: transform .12s ease, background .12s ease; }
    .niche-switch .niche:hover { background: rgba(255,255,255,.1); color: #fff; }
    .niche-switch .niche:active { transform: scale(.96); }
    .niche-switch .niche:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .niche-switch .niche.on { background: #fff; color: #18211f; border-color: #fff; }
    .speed { align-items: center; }
    .speed .nums { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
    .speed .nums span { font: 500 12.5px/1.3 Geist, system-ui, sans-serif; color: #4a5551; }
    .speed .nums b { display: block; font: 700 18px/1.1 "Bricolage Grotesque", system-ui, sans-serif; color: #18211f; }
    .tl-ico.held { background: #fff4e0; color: #a8681f; }
    @media (prefers-color-scheme: dark) {
      .speed .nums span { color: #a9b3af; }
      .speed .nums b { color: #f2f1ec; }
    }
  </style>
</head>
<body>
  <div class="demobar">
    <p><span class="long">White-label demo. Fictional company, sample data.</span><span class="short">Demo. Fictional company, sample data.</span></p>
    <div class="demobar-right">
      <button type="button" class="demobar-link" id="tour-start" data-tour-start><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>Guide</button>
    </div>
  </div>
  <nav class="niche-switch" id="niche-switch" aria-label="Pick a trade"></nav>

  <div class="app">
    <aside class="sidebar" aria-label="Portal navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">··</span>
        <span class="brand-text">
          <strong>Loading</strong>
          <small>demo</small>
        </span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <p>Every form lead gets an AI call in under a minute. Calls, chats, forms and ad leads all land here on their own.</p>
        <button type="button" class="tour-side" data-tour-start>Step-by-step guide<span aria-hidden="true"> →</span></button>
        <p class="powered">Client portal by <strong>your agency</strong></p>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data-tree.js"></script>
  <script src="data-pool.js"></script>
  <script src="data-epoxy.js"></script>
  <script src="data-junk.js"></script>
  <script src="data-pest.js"></script>
  <script src="pick.js"></script>
  <script src="app.js"></script>
  <script src="tour.js"></script>
</body>
</html>
